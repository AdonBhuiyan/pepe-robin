<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>404 – Page not found | PEPEROBIN ($PEPEHOOD)</title>
    <meta
      name="description"
      content="This page could not be found. Head back to PEPEROBIN, Pepe the Robinhood on Solana."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0E1A12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://peperobin.com/assets/fonts/Bangers-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* All URLs are absolute (/...) so this page works at ANY broken path, e.g. /foo/bar */
      @font-face {
        font-family: "Bangers";
        src: url("https://peperobin.com/assets/fonts/Bangers-Regular.ttf")
          format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Cinzel Decorative";
        src: url("https://peperobin.com/assets/fonts/CinzelDecorative-Bold.ttf")
          format("truetype");
        font-weight: 700;
        font-display: swap;
      }

      :root {
        --bg: #0e1a12;
        --card: #16271b;
        --neon: #39ff14;
        --gold: #d4a017;
        --gold-light: #f6d365;
        --red: #d62828;
        --text: #f5f1e6;
        --f-display: "Bangers", Impact, system-ui, sans-serif;
        --f-fancy: "Cinzel Decorative", Georgia, serif;
        --f-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
        --ease: cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        color: var(--text);
        color-scheme: dark;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        font-family: var(--f-body);
        background: var(--bg);
        color: var(--text);
      }
      a {
        color: inherit;
      }

      /* ---------- Scene (fixed, behind everything) ---------- */
      .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          180deg,
          #070d09 0%,
          #0f2016 34%,
          #2b2a24 62%,
          #a94a26 84%,
          #e08a2f 100%
        );
      }
      .sky::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.8;
        background-image:
          radial-gradient(1.5px 1.5px at 8% 10%, #fff, transparent),
          radial-gradient(2px 2px at 22% 24%, #f6d365, transparent),
          radial-gradient(1.5px 1.5px at 41% 8%, #fff, transparent),
          radial-gradient(2px 2px at 63% 18%, #fff, transparent),
          radial-gradient(1.5px 1.5px at 81% 9%, #f6d365, transparent),
          radial-gradient(2px 2px at 93% 27%, #fff, transparent);
      }
      .sky::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          70% 45% at 50% 100%,
          rgba(246, 180, 70, 0.55),
          transparent 70%
        );
      }

      .forest {
        position: fixed;
        left: -40px;
        right: -40px;
        bottom: 0;
        z-index: 1;
        pointer-events: none;
        will-change: transform;
      }
      .forest svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .forest--back {
        height: 224px;
        transform: translate3d(calc(var(--mx, 0) * -14px), 0, 0);
      }
      .forest--front {
        height: 160px;
        transform: translate3d(calc(var(--mx, 0) * -30px), 0, 0);
      }

      #fx {
        position: fixed;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      /* ---------- Layout ---------- */
      .page {
        position: relative;
        z-index: 5;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: calc(0.9rem + env(safe-area-inset-top, 0px)) 1.25rem
          calc(96px + env(safe-area-inset-bottom, 0px));
      }
      .logo {
        align-self: flex-start;
        display: inline-flex;
        border-radius: 14px;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.4s var(--ease);
      }
      .logo img {
        display: block;
        width: auto;
        height: clamp(64px, 12vw, 96px);
        max-width: 70vw;
        object-fit: contain;
        filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.65))
          drop-shadow(0 0 14px rgba(212, 160, 23, 0.3));
      }
      .logo:hover {
        transform: scale(1.05) rotate(-1.5deg);
      }

      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: clamp(0.6rem, 1.6vh, 1.2rem);
        padding-block: 1rem;
      }

      /* ---------- The memorable thing: 4 [target] 4 ---------- */
      .digits {
        margin: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.03em;
        font-family: var(--f-display);
        font-size: clamp(8rem, min(44vw, 34vh), 24rem);
        line-height: 0.85;
        letter-spacing: 0.02em;
        transform: translate3d(
          calc(var(--mx, 0) * 10px),
          calc(var(--my, 0) * 8px),
          0
        );
        animation: rise 0.9s var(--ease) both;
      }
      .digits span {
        background: linear-gradient(
          180deg,
          var(--gold-light) 8%,
          var(--gold) 55%,
          #9a6c08 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0.05em 0 #5a4004)
          drop-shadow(0 0 0.25em rgba(212, 160, 23, 0.45));
      }
      .target {
        width: 0.68em;
        height: 0.68em;
        overflow: visible;
        flex: none;
        filter: drop-shadow(0 0.05em 0 rgba(0, 0, 0, 0.55))
          drop-shadow(0 0 0.22em rgba(214, 40, 40, 0.55));
      }
      .arrow {
        transform-origin: 100px 100px;
        animation:
          stick 0.7s 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both,
          wobble 1.4s 1.2s ease-out both;
      }
      @keyframes stick {
        from {
          transform: translate(-46px, -84px);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        to {
          transform: translate(0, 0);
          opacity: 1;
        }
      }
      @keyframes wobble {
        0% {
          transform: rotate(0);
        }
        18% {
          transform: rotate(3.4deg);
        }
        38% {
          transform: rotate(-2.4deg);
        }
        58% {
          transform: rotate(1.4deg);
        }
        78% {
          transform: rotate(-0.6deg);
        }
        100% {
          transform: rotate(0);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(46px) scale(0.94);
        }
        to {
          opacity: 1;
        }
      }

      h1 {
        margin: 0;
        font-family: var(--f-fancy);
        font-weight: 700;
        font-size: clamp(2.1rem, 6.4vw, 4.4rem);
        line-height: 1.1;
        text-shadow:
          0 4px 0 rgba(0, 0, 0, 0.55),
          0 0 34px rgba(212, 160, 23, 0.35);
        animation: rise 0.8s 0.25s var(--ease) both;
      }
      .lead {
        margin: 0;
        max-width: 34ch;
        font-size: clamp(1.15rem, 2.5vw, 1.6rem);
        line-height: 1.55;
        color: rgba(245, 241, 230, 0.92);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
        animation: rise 0.8s 0.35s var(--ease) both;
      }
      .path {
        margin: 0;
        max-width: 92vw;
        font-size: clamp(0.95rem, 1.8vw, 1.1rem);
        color: rgba(245, 241, 230, 0.75);
        animation: rise 0.8s 0.4s var(--ease) both;
      }
      .path code {
        display: inline-block;
        max-width: 60vw;
        vertical-align: bottom;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 0.15em 0.6em;
        margin-left: 0.3em;
        border: 1px solid rgba(212, 160, 23, 0.5);
        border-radius: 10px;
        background: var(--card);
        color: var(--gold-light);
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }

      /* ---------- Buttons ---------- */
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        margin-top: 0.6rem;
        width: 100%;
        animation: rise 0.8s 0.5s var(--ease) both;
      }
      .btn {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 64px;
        padding: 0.35em 1.5em;
        width: min(100%, 22rem);
        font-family: var(--f-display);
        font-size: clamp(1.7rem, 3.2vw, 2.2rem);
        letter-spacing: 0.05em;
        text-decoration: none;
        border-radius: 999px;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.3s var(--ease),
          box-shadow 0.3s ease,
          background 0.3s ease,
          color 0.3s ease;
      }
      .btn--gold {
        color: var(--bg);
        background: linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold) 55%,
          #b07d0c
        );
        box-shadow:
          0 6px 0 #6f5006,
          0 14px 34px rgba(212, 160, 23, 0.5);
      }
      .btn--gold::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          110deg,
          transparent 30%,
          rgba(255, 255, 255, 0.6) 50%,
          transparent 70%
        );
        transform: translateX(-130%);
        transition: transform 0.8s ease;
      }
      .btn--ghost {
        color: var(--text);
        background: rgba(14, 26, 18, 0.55);
        box-shadow: inset 0 0 0 2px rgba(212, 160, 23, 0.7);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }
      @media (hover: hover) {
        .btn:hover {
          transform: translateY(-5px);
        }
        .btn--gold:hover {
          box-shadow:
            0 11px 0 #6f5006,
            0 20px 44px rgba(212, 160, 23, 0.65);
        }
        .btn--gold:hover::after {
          transform: translateX(130%);
        }
        .btn--ghost:hover {
          color: var(--bg);
          background: var(--gold-light);
          box-shadow:
            0 6px 0 #6f5006,
            0 14px 34px rgba(212, 160, 23, 0.5);
        }
      }
      .btn:active {
        transform: translateY(2px) scale(0.97);
        box-shadow: 0 2px 0 #6f5006;
      }
      :where(a, button):focus-visible {
        outline: 3px solid var(--neon);
        outline-offset: 4px;
      }

      .hint {
        margin: 0.4rem 0 0;
        padding: 0.5em 1.1em;
        border-radius: 999px;
        background: rgba(14, 26, 18, 0.7);
        border: 1px solid rgba(57, 255, 20, 0.35);
        font-size: clamp(0.95rem, 1.8vw, 1.1rem);
        color: rgba(245, 241, 230, 0.85);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        animation: rise 0.8s 0.6s var(--ease) both;
      }
      .hint b {
        color: var(--neon);
        font-weight: 600;
      }

      /* ---------- Ticker ---------- */
      .ticker {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        overflow: hidden;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: rgba(14, 26, 18, 0.94);
        border-top: 3px solid var(--gold);
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
      }
      .ticker__track {
        display: flex;
        width: max-content;
        animation: marquee 32s linear infinite;
      }
      .ticker span {
        flex: none;
        padding: 0.3em 0;
        font-family: var(--f-display);
        font-size: clamp(1.6rem, 4vw, 2.3rem);
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .ticker i {
        margin: 0 0.55em;
        font-style: normal;
        color: var(--red);
      }
      @keyframes marquee {
        to {
          transform: translateX(-50%);
        }
      }

      /* ---------- Shot feedback ---------- */
      .pop {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        transform: translate(-50%, -50%);
        font-family: var(--f-display);
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        letter-spacing: 0.05em;
        white-space: nowrap;
        color: var(--gold-light);
        text-shadow:
          0 3px 0 #5a4004,
          0 0 18px rgba(212, 160, 23, 0.8);
        animation: pop 1.1s ease-out forwards;
      }
      .pop.big {
        font-size: clamp(3rem, 10vw, 5.5rem);
        color: var(--neon);
        text-shadow:
          0 4px 0 #0a3a06,
          0 0 30px rgba(57, 255, 20, 0.9);
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -30%) scale(0.5);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -70%) scale(1.15);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -190%) scale(1);
        }
      }

      /* ---------- Desktop ---------- */
      @media (min-width: 640px) {
        .actions {
          gap: 1.25rem;
        }
        .btn {
          width: auto;
          min-width: 15rem;
        }
      }
      @media (min-width: 992px) {
        .page {
          padding-inline: clamp(1.5rem, 4vw, 4rem);
        }
        .logo img {
          height: 96px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
        .digits,
        .forest {
          transform: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="sky" aria-hidden="true"></div>

    <!-- Forest silhouettes (two parallax layers, repeated pine pattern) -->
    <div class="forest forest--back" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <defs>
          <pattern
            id="pinesB"
            width="120"
            height="160"
            patternUnits="userSpaceOnUse"
            patternTransform="scale(1.4)"
          >
            <path
              fill="#0a150d"
              d="M60 0l28 50H74l26 50H84l28 50H8l28-50H20l26-50H32zM0 148h120v12H0z"
            />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#pinesB)" />
      </svg>
    </div>
    <div class="forest forest--front" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <defs>
          <pattern
            id="pinesF"
            width="120"
            height="160"
            patternUnits="userSpaceOnUse"
            patternTransform="translate(48 0)"
          >
            <path
              fill="#050b07"
              d="M60 0l28 50H74l26 50H84l28 50H8l28-50H20l26-50H32zM0 148h120v12H0z"
            />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#pinesF)" />
      </svg>
    </div>

    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="page">
      <!-- Replace width/height with the real pixel size of logo.webp -->
      <a class="logo" href="/">
        <img
          src="https://peperobin.com/assets/images/mobile/logos/logo.webp"
          alt="Pepe the Robinhood – home"
          width="280"
          height="96"
          decoding="async"
          fetchpriority="high"
        />
      </a>

      <main class="hero">
        <p class="digits" role="img" aria-label="Error 404">
          <span>4</span>
          <svg
            id="bull"
            class="target"
            viewBox="0 0 200 200"
            focusable="false"
            aria-hidden="true"
          >
            <circle
              cx="100"
              cy="100"
              r="98"
              fill="#d62828"
              stroke="#d4a017"
              stroke-width="4"
            />
            <circle cx="100" cy="100" r="76" fill="#f5f1e6" />
            <circle cx="100" cy="100" r="56" fill="#d62828" />
            <circle cx="100" cy="100" r="36" fill="#f5f1e6" />
            <circle
              cx="100"
              cy="100"
              r="17"
              fill="#d4a017"
              stroke="#6f5006"
              stroke-width="3"
            />
            <g class="arrow">
              <g transform="rotate(-30 100 100)">
                <line
                  x1="100"
                  y1="100"
                  x2="100"
                  y2="-26"
                  stroke="#7a4a1c"
                  stroke-width="6"
                  stroke-linecap="round"
                />
                <path
                  d="M100 -26l-11-16 11 7 11-7zM100 -6l-10-14 10 6 10-6z"
                  fill="#d62828"
                />
                <path d="M100 14l-8-11 8 5 8-5z" fill="#f5f1e6" />
              </g>
            </g>
          </svg>
          <span>4</span>
        </p>

        <h1>
          This page got robbed.<span
            class="sr"
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip: rect(0 0 0 0);
            "
          >
            Error 404, page not found.</span
          >
        </h1>
        <p class="lead">
          The link may be broken, or the page may have moved. Go back home and
          pick a path from there.
        </p>
        <p class="path"><code id="path"></code></p>

        <div class="actions">
          <a class="btn btn--gold" href="https://peperobin.com">Back to Home</a>
          <a class="btn btn--ghost" href="https://peperobin.com/#story"
            >Read the Story</a
          >
          <a class="btn btn--ghost" href="https://peperobin.com/#tokenomics"
            >See Tokenomics</a
          >
        </div>

        <p class="hint" id="stats">
          Tap anywhere to shoot. Hit the <b>bullseye</b> for a coin shower.
        </p>
      </main>
    </div>

    <div class="ticker" aria-hidden="true">
      <div class="ticker__track" id="ticker"></div>
    </div>

    <script>
      (() => {
        "use strict";
        const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const $ = (s) => document.querySelector(s);
        const cv = $("#fx"),
          cx = cv.getContext("2d"),
          bull = $("#bull"),
          stats = $("#stats");
        const rnd = (a, b) => a + Math.random() * (b - a);
        const TAU = Math.PI * 2;
        let W,
          H,
          ff = [],
          ps = [],
          ar = [],
          shots = 0,
          bulls = 0,
          last = 0,
          raf;

        /* requested path (textContent only, so it can't inject HTML) */
        $("#path").textContent =
          decodeURIComponent(location.pathname).slice(0, 80) || "/";

        /* ticker */
        const phrase =
          "Take from the Rich<i>♦</i>Pepe the Robinhood<i>♦</i>$PEPEHOOD<i>♦</i>Error 404<i>♦</i>";
        $("#ticker").innerHTML = `<span>${phrase.repeat(3)}</span>`.repeat(2);

        /* canvas + fireflies */
        function size() {
          const d = Math.min(devicePixelRatio || 1, 2);
          W = innerWidth;
          H = innerHeight;
          cv.width = W * d;
          cv.height = H * d;
          cx.setTransform(d, 0, 0, d, 0, 0);
          const n = RM ? 0 : W < 700 ? 26 : 56;
          ff = Array.from({ length: n }, () => ({
            x: rnd(0, W),
            y: rnd(H * 0.2, H),
            r: rnd(1.2, 3.2),
            vx: rnd(-0.15, 0.15),
            vy: rnd(-0.35, -0.08),
            p: rnd(0, 6.28),
            g: Math.random() < 0.35,
          }));
        }

        function pop(x, y, text, big) {
          const s = document.createElement("span");
          s.className = "pop" + (big ? " big" : "");
          s.textContent = text;
          s.style.left = x + "px";
          s.style.top = y + "px";
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 1200);
        }

        function impact(a) {
          const r = bull.getBoundingClientRect();
          const d =
            Math.hypot(
              a.x1 - (r.left + r.width / 2),
              a.y1 - (r.top + r.height / 2),
            ) /
            (r.width / 2);
          let msg,
            isBull = false;
          if (d < 0.17) {
            msg = "BULLSEYE!";
            isBull = true;
            bulls++;
          } else if (d < 0.55) msg = "Nice shot!";
          else if (d < 1) msg = "On target";
          else msg = "Missed. Like this page.";

          for (let i = 0; i < 12; i++)
            ps.push({
              x: a.x1,
              y: a.y1,
              vx: rnd(-4, 4),
              vy: rnd(-5, 1),
              s: rnd(1.5, 3.5),
              c: Math.random() < 0.5 ? "#f6d365" : "#39ff14",
              life: 34,
              rot: 0,
              vr: 0,
            });
          if (isBull)
            for (let i = 0; i < 42; i++)
              ps.push({
                x: a.x1,
                y: a.y1,
                vx: rnd(-7, 7),
                vy: rnd(-16, -5),
                s: rnd(6, 11),
                coin: true,
                life: 140,
                rot: rnd(0, 6),
                vr: rnd(0.15, 0.4),
              });
          pop(a.x1, a.y1 - 20, msg, isBull);
          stats.innerHTML = `Arrows: ${shots}. Bullseyes: <b>${bulls}</b>. Keep shooting.`;
        }

        function shoot(x, y) {
          shots++;
          const x0 = Math.max(28, W * 0.06),
            y0 = H - Math.min(150, H * 0.22),
            dist = Math.hypot(x - x0, y - y0);
          ar.push({
            x0,
            y0,
            x1: x,
            y1: y,
            t: RM ? 1 : 0,
            d: Math.min(720, Math.max(300, dist * 0.55)),
            h: Math.min(170, dist * 0.18),
            done: false,
            hold: 42,
          });
          if (!raf) raf = requestAnimationFrame(frame);
        }

        function drawArrow(a, px, py, ang) {
          cx.save();
          cx.translate(px, py);
          cx.rotate(ang);
          cx.globalAlpha = Math.min(1, a.hold / 14);
          cx.strokeStyle = "#8b5a2b";
          cx.lineWidth = 3;
          cx.lineCap = "round";
          cx.beginPath();
          cx.moveTo(-48, 0);
          cx.lineTo(0, 0);
          cx.stroke();
          cx.fillStyle = "#d4a017";
          cx.beginPath();
          cx.moveTo(8, 0);
          cx.lineTo(-5, -5);
          cx.lineTo(-5, 5);
          cx.fill();
          cx.fillStyle = "#d62828";
          cx.beginPath();
          cx.moveTo(-48, 0);
          cx.lineTo(-58, -7);
          cx.lineTo(-40, -1);
          cx.moveTo(-48, 0);
          cx.lineTo(-58, 7);
          cx.lineTo(-40, 1);
          cx.fill();
          cx.restore();
        }

        function frame(t) {
          const dt = Math.min((t - last) / 16.7 || 1, 3);
          last = t;
          cx.clearRect(0, 0, W, H);

          cx.globalCompositeOperation = "lighter";
          for (const f of ff) {
            f.x += f.vx * dt + Math.sin(t / 900 + f.p) * 0.25;
            f.y += f.vy * dt;
            if (f.y < -10) {
              f.y = H + 10;
              f.x = rnd(0, W);
            }
            const a = 0.35 + 0.35 * Math.sin(t / 600 + f.p),
              c = f.g ? "212,160,23" : "57,255,20";
            cx.fillStyle = `rgba(${c},${a * 0.18})`;
            cx.beginPath();
            cx.arc(f.x, f.y, f.r * 5, 0, TAU);
            cx.fill();
            cx.fillStyle = `rgba(${c},${Math.min(1, a + 0.3)})`;
            cx.beginPath();
            cx.arc(f.x, f.y, f.r, 0, TAU);
            cx.fill();
          }
          cx.globalCompositeOperation = "source-over";

          for (let i = ps.length - 1; i >= 0; i--) {
            const p = ps[i];
            p.vy += 0.35 * dt * (p.coin ? 1 : 0.4);
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rot += p.vr * dt;
            p.life -= dt;
            if (p.life <= 0 || p.y > H + 30) {
              ps.splice(i, 1);
              continue;
            }
            cx.save();
            cx.translate(p.x, p.y);
            cx.globalAlpha = Math.min(1, p.life / 20);
            if (p.coin) {
              cx.scale(Math.abs(Math.cos(p.rot)) || 0.05, 1);
              cx.fillStyle = "#d4a017";
              cx.strokeStyle = "#f6d365";
              cx.lineWidth = 2;
              cx.beginPath();
              cx.arc(0, 0, p.s, 0, TAU);
              cx.fill();
              cx.stroke();
            } else {
              cx.fillStyle = p.c;
              cx.beginPath();
              cx.arc(0, 0, p.s, 0, TAU);
              cx.fill();
            }
            cx.restore();
          }

          for (let i = ar.length - 1; i >= 0; i--) {
            const a = ar[i],
              dx = a.x1 - a.x0,
              dy = a.y1 - a.y0;
            if (!a.done) {
              a.t = Math.min(1, a.t + (dt * 16.7) / a.d);
              const px = a.x0 + dx * a.t,
                py = a.y0 + dy * a.t - Math.sin(Math.PI * a.t) * a.h;
              drawArrow(
                a,
                px,
                py,
                Math.atan2(dy - Math.PI * Math.cos(Math.PI * a.t) * a.h, dx),
              );
              if (a.t >= 1) {
                a.done = true;
                impact(a);
              }
            } else {
              a.hold -= dt;
              if (a.hold <= 0) {
                ar.splice(i, 1);
                continue;
              }
              drawArrow(a, a.x1, a.y1, Math.atan2(dy - Math.PI * -1 * a.h, dx));
            }
          }

          /* idle: stop the loop when nothing is animating */
          if (!ff.length && !ps.length && !ar.length) {
            raf = 0;
            return;
          }
          raf = requestAnimationFrame(frame);
        }

        addEventListener("pointerdown", (e) => {
          if (e.button > 0 || e.target.closest("a,button")) return;
          shoot(e.clientX, e.clientY);
        });

        if (!RM && matchMedia("(hover: hover)").matches) {
          addEventListener(
            "pointermove",
            (e) => {
              const s = document.documentElement.style;
              s.setProperty("--mx", (e.clientX / W - 0.5).toFixed(3));
              s.setProperty("--my", (e.clientY / H - 0.5).toFixed(3));
            },
            { passive: true },
          );
        }

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            cancelAnimationFrame(raf);
            raf = 0;
          } else if (!raf) {
            last = performance.now();
            raf = requestAnimationFrame(frame);
          }
        });

        addEventListener("resize", size);
        size();
        raf = requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
