<div class="contact" aria-labelledby="contact-title">
  <div class="contact__card">
    <div class="contact__badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path
          fill="currentColor"
          d="M12 2 4 5v6c0 5.25 3.4 10.15 8 11 4.6-.85 8-5.75 8-11V5l-8-3zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.8-4.8 1.4 1.4-6.2 6.2z"
        />
      </svg>
    </div>

    <div class="contact__info">
      <h2 class="contact__title" id="contact-title">Contact Address</h2>
      <p class="contact__address" id="contact-address">
        8NTS1rMVtpV5mqg8o8AvBE8CwX5uLsAKiSmBG2yXwGzq
      </p>
      <p class="contact__hint">
        Always double-check this address before you buy.
      </p>
    </div>

    <button
      type="button"
      class="contact__copy"
      id="contact-copy"
      data-copy-target="#contact-address"
      aria-label="Copy contact address"
    >
      <svg
        class="contact__icon contact__icon--copy"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"
        />
      </svg>
      <svg
        class="contact__icon contact__icon--done"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="currentColor"
          d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"
        />
      </svg>
      <span class="contact__copy-label">Copy</span>
    </button>
  </div>

  <p
    class="contact__status"
    id="contact-status"
    role="status"
    aria-live="polite"
  ></p>
</div>
